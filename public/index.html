<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Indeks żywności — Kogucia Łączka
  </title>

  <style>
    :root {
      color-scheme: light;
      --green: #274e13;
      --light-green: #d9ead3;
      --cream: #f7f8f4;
      --yellow: #fff2cc;
      --text: #20251f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      max-width: 920px;
      margin: 50px auto;
      padding: 20px;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--cream);
    }

    main {
      padding: 36px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px #00000012;
    }

    h1 {
      color: var(--green);
      line-height: 1.2;
    }

    .status {
      display: inline-block;
      padding: 7px 13px;
      border-radius: 999px;
      background: var(--yellow);
      font-weight: 700;
    }

    .rules {
      margin-top: 28px;
      padding: 20px;
      border-left: 5px solid var(--green);
      background: var(--light-green);
    }
  </style>
</head>

<body>
  <main>
    <p class="status">
      Wersja rozwojowa 2.0
    </p>

    <h1>
      Indeks żywności Kogucia Łączka
    </h1>

    <p>
      Trwa budowa automatycznego,
      audytowalnego indeksu gęstości
      odżywczej i ekonomicznej żywności.
    </p>

    <div class="rules">
      <strong>
        Najpierw wiarygodność.
      </strong>

      <p>
        Wyniki nie są jeszcze publikowane.
        Silnik musi najpierw przejść walidację
        metodologii i testy referencyjne.
      </p>
    </div>
  </main>
</body>
</html>
