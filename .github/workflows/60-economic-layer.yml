      - name: "Kontrola bezpieczeństwa"
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          import re
          from pathlib import Path


          roots = [
              Path("src"),
              Path("data/prices"),
              Path("data/results"),
              Path("public"),
          ]

          patterns = [
              re.compile(r"AIza[0-9A-Za-z_-]{30,}"),
              re.compile(r"github_pat_[0-9A-Za-z_]{20,}"),
              re.compile(r"ghp_[0-9A-Za-z]{20,}"),
              re.compile(r"sk-[0-9A-Za-z]{20,}"),
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(
                  r"(?i)bearer\s+[0-9A-Za-z._~+/=-]{20,}"
              ),
          ]

          matches = []

          for root in roots:
              if not root.exists():
                  continue

              for path in root.rglob("*"):
                  if not path.is_file():
                      continue

                  try:
                      text = path.read_text(
                          encoding="utf-8",
                          errors="ignore",
                      )
                  except OSError:
                      continue

                  for pattern in patterns:
                      if pattern.search(text):
                          matches.append(
                              f"{path}: {pattern.pattern}"
                          )

          if matches:
              raise RuntimeError(
                  "Wykryto potencjalne sekrety:\n"
                  + "\n".join(matches)
              )

          print("Kontrola bezpieczeństwa: 0 sekretów.")
          PYTHON

