name: 00 - Instalacja projektu

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    name: Instalacja fundamentu
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Przygotowanie Pythona
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Sprawdzenie klucza USDA
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          key = os.environ.get("USDA_API_KEY", "").strip()

          if not key:
              raise SystemExit(
                  "BŁĄD: Nie znaleziono sekretu USDA_API_KEY."
              )

          url = (
              "https://api.nal.usda.gov/fdc/v1/foods/search"
              "?api_key=" + key
          )

          payload = json.dumps(
              {
                  "query": "beef liver raw",
                  "pageSize": 1,
                  "dataType": [
                      "Foundation",
                      "SR Legacy"
                  ]
              }
          ).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "KoguciaLaczka-IndeksZywnosci/2.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  result = json.loads(
                      response.read().decode("utf-8")
                  )

          except urllib.error.HTTPError as error:
              raise SystemExit(
                  "BŁĄD USDA HTTP: "
                  + str(error.code)
                  + ". Sprawdź sekret USDA_API_KEY."
              )

          except urllib.error.URLError as error:
              raise SystemExit(
                  "BŁĄD POŁĄCZENIA USDA: "
                  + str(error.reason)
              )

          foods = result.get("foods", [])

          if not foods:
              raise SystemExit(
                  "BŁĄD: USDA odpowiedziało, ale nie zwróciło produktu."
              )

          food = foods[0]

          print("USDA API: OK")
          print("Przykładowy FDC ID:", food.get("fdcId"))
          print("Przykładowy produkt:", food.get("description"))
          PY

      - name: Utworzenie struktury katalogów
        run: |
          mkdir -p config
          mkdir -p data/catalog
          mkdir -p data/raw
          mkdir -p data/normalized
          mkdir -p data/prices
          mkdir -p data/snapshots
          mkdir -p artifacts
          mkdir -p src
          mkdir -p tests
          mkdir -p public

          touch data/raw/.gitkeep
          touch data/normalized/.gitkeep
          touch data/prices/.gitkeep
          touch data/snapshots/.gitkeep
          touch artifacts/.gitkeep

      - name: Utworzenie zależności
        run: |
          cat > requirements.txt <<'EOF'
          duckdb>=1.1,<2
          pandas>=2.2,<3
          PyYAML>=6,<7
          requests>=2.32,<3
          Jinja2>=3.1,<4
          pytest>=8,<9
          EOF

          cat > pytest.ini <<'EOF'
          [pytest]
          pythonpath = .
          testpaths = tests
          addopts = -ra
          EOF

      - name: Utworzenie konfiguracji projektu
        run: |
          cat > config/project.yaml <<'EOF'
          project:
            name: "Indeks żywności Kogucia Łączka"
            version: "2.0.0-dev"
            language: "pl"
            status: "development"

          sources:
            usda:
              enabled: true
              preferred_types:
                - "Foundation"
                - "SR Legacy"
                - "FNDDS"
              branded_foods_enabled: false

          publication:
            public_directory: "public"
            publish_incomplete_results: false
            show_component_scores: true
            show_sources: true
            show_methodology_version: true

          safety:
            fail_on_missing_source: true
            fail_on_unknown_unit: true
            fail_on_duplicate_product_id: true
            fail_on_negative_nutrient_value: true
            preserve_last_valid_publication: true
          EOF

          cat > config/methodology.yaml <<'EOF'
          methodology:
            version: "2.0.0-dev"
            status: "draft"
            description: >
              Otwarty i audytowalny indeks gęstości odżywczej
              oraz ekonomicznej żywności.

          scoring:
            per_100g_weight: 0.60
            per_100kcal_weight: 0.40
            nutrient_cap: 120
            full_completeness_minimum: 0.80
            conditional_completeness_minimum: 0.60

          rules:
            missing_value_is_zero: false
            distinguish_measured_calculated_imputed: true
            separate_nutrition_from_price: true
            separate_production_system_layer: true
            separate_bioavailability_layer: true
            expose_component_scores: true

          group_weights:
            minerals: 0.30
            vitamins: 0.30
            protein_and_amino_acids: 0.20
            fatty_acids: 0.10
            fiber_and_functional: 0.10

          disclaimer:
            pl: >
              Indeks służy edukacji i porównywaniu żywności.
              Nie stanowi diagnozy ani indywidualnego
              zalecenia medycznego.
          EOF

      - name: Utworzenie katalogu produktów
        run: |
          cat > data/catalog/products.csv <<'EOF'
          product_id,name_pl,fdc_id,category,state,status
          EOF

      - name: Utworzenie modułu ustawień
        run: |
          cat > src/__init__.py <<'EOF'
          """
          Silnik Indeksu Żywności Kogucia Łączka.
          """
          EOF

          cat > src/settings.py <<'EOF'
          from pathlib import Path

          import yaml


          ROOT = Path(__file__).resolve().parents[1]
          CONFIG_DIR = ROOT / "config"
          DATA_DIR = ROOT / "data"
          PUBLIC_DIR = ROOT / "public"
          ARTIFACTS_DIR = ROOT / "artifacts"


          def load_yaml(name: str) -> dict:
              path = CONFIG_DIR / name

              if not path.exists():
                  raise FileNotFoundError(
                      f"Nie znaleziono konfiguracji: {path}"
                  )

              with path.open(
                  "r",
                  encoding="utf-8"
              ) as handle:
                  result = yaml.safe_load(handle)

              if not isinstance(result, dict):
                  raise ValueError(
                      f"Konfiguracja {name} nie jest słownikiem."
                  )

              return result


          def load_project_config() -> dict:
              return load_yaml("project.yaml")


          def load_methodology() -> dict:
              return load_yaml("methodology.yaml")
          EOF

      - name: Utworzenie walidatora konfiguracji
        run: |
          cat > src/validate_config.py <<'EOF'
          from decimal import Decimal

          from src.settings import (
              load_methodology,
              load_project_config,
          )


          def validate() -> dict:
              project = load_project_config()
              methodology = load_methodology()

              scoring = methodology["scoring"]
              groups = methodology["group_weights"]

              mass_weight = Decimal(
                  str(scoring["per_100g_weight"])
              )

              energy_weight = Decimal(
                  str(scoring["per_100kcal_weight"])
              )

              if (
                  mass_weight + energy_weight
                  != Decimal("1.0")
              ):
                  raise ValueError(
                      "Wagi 100 g i 100 kcal "
                      "nie sumują się do 1."
                  )

              group_sum = sum(
                  (
                      Decimal(str(value))
                      for value in groups.values()
                  ),
                  Decimal("0")
              )

              if group_sum != Decimal("1.0"):
                  raise ValueError(
                      "Wagi grup składników "
                      "nie sumują się do 1."
                  )

              full = Decimal(
                  str(
                      scoring[
                          "full_completeness_minimum"
                      ]
                  )
              )

              conditional = Decimal(
                  str(
                      scoring[
                          "conditional_completeness_minimum"
                      ]
                  )
              )

              if not (
                  Decimal("0")
                  < conditional
                  < full
                  <= Decimal("1")
              ):
                  raise ValueError(
                      "Nieprawidłowe progi kompletności."
                  )

              publication = project["publication"]

              if publication[
                  "publish_incomplete_results"
              ]:
                  raise ValueError(
                      "Publikowanie niepełnych wyników "
                      "musi być wyłączone."
                  )

              if not publication[
                  "show_component_scores"
              ]:
                  raise ValueError(
                      "Punkty cząstkowe muszą być jawne."
                  )

              if not publication["show_sources"]:
                  raise ValueError(
                      "Źródła muszą być jawne."
                  )

              return {
                  "project":
                      project["project"]["name"],
                  "project_version":
                      project["project"]["version"],
                  "methodology_version":
                      methodology[
                          "methodology"
                      ]["version"],
                  "status": "OK",
              }


          if __name__ == "__main__":
              print(validate())
          EOF

      - name: Utworzenie testów
        run: |
          cat > tests/test_configuration.py <<'EOF'
          from decimal import Decimal

          from src.settings import (
              load_methodology,
              load_project_config,
          )
          from src.validate_config import validate


          def test_configuration_is_valid():
              result = validate()

              assert result["status"] == "OK"
              assert (
                  result["methodology_version"]
                  == "2.0.0-dev"
              )


          def test_scoring_weights_sum_to_one():
              methodology = load_methodology()
              scoring = methodology["scoring"]

              total = (
                  Decimal(
                      str(scoring["per_100g_weight"])
                  )
                  + Decimal(
                      str(
                          scoring[
                              "per_100kcal_weight"
                          ]
                      )
                  )
              )

              assert total == Decimal("1.0")


          def test_group_weights_sum_to_one():
              methodology = load_methodology()
              groups = methodology["group_weights"]

              total = sum(
                  (
                      Decimal(str(value))
                      for value in groups.values()
                  ),
                  Decimal("0")
              )

              assert total == Decimal("1.0")


          def test_incomplete_results_are_not_published():
              project = load_project_config()

              assert (
                  project["publication"][
                      "publish_incomplete_results"
                  ]
                  is False
              )


          def test_component_scores_are_public():
              project = load_project_config()

              assert (
                  project["publication"][
                      "show_component_scores"
                  ]
                  is True
              )
          EOF

      - name: Utworzenie strony startowej
        run: |
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="pl">
          <head>
            <meta charset="utf-8">
            <meta
              name="viewport"
              content="width=device-width, initial-scale=1"
            >
            <title>
              Indeks żywności — Kogucia Łączka
            </title>

            <style>
              :root {
                color-scheme: light;
                --green: #274e13;
                --light-green: #d9ead3;
                --cream: #f7f8f4;
                --yellow: #fff2cc;
                --text: #20251f;
              }

              * {
                box-sizing: border-box;
              }

              body {
                max-width: 920px;
                margin: 50px auto;
                padding: 20px;
                font-family:
                  system-ui,
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  sans-serif;
                line-height: 1.6;
                color: var(--text);
                background: var(--cream);
              }

              main {
                padding: 36px;
                background: white;
                border-radius: 16px;
                box-shadow: 0 4px 24px #00000012;
              }

              h1 {
                color: var(--green);
                line-height: 1.2;
              }

              .status {
                display: inline-block;
                padding: 7px 13px;
                border-radius: 999px;
                background: var(--yellow);
                font-weight: 700;
              }

              .rules {
                margin-top: 28px;
                padding: 20px;
                border-left: 5px solid var(--green);
                background: var(--light-green);
              }
            </style>
          </head>

          <body>
            <main>
              <p class="status">
                Wersja rozwojowa 2.0
              </p>

              <h1>
                Indeks żywności Kogucia Łączka
              </h1>

              <p>
                Trwa budowa automatycznego,
                audytowalnego indeksu gęstości
                odżywczej i ekonomicznej żywności.
              </p>

              <div class="rules">
                <strong>Najpierw wiarygodność.</strong>

                <p>
                  Wyniki nie są jeszcze publikowane.
                  Silnik musi najpierw przejść walidację
                  metodologii i testy referencyjne.
                </p>
              </div>
            </main>
          </body>
          </html>
          EOF

      - name: Utworzenie dokumentacji
        run: |
          cat > README.md <<'EOF'
          # Indeks żywności — Kogucia Łączka

          Otwarty i audytowalny indeks gęstości
          odżywczej oraz ekonomicznej żywności.

          ## Status

          Projekt znajduje się w fazie budowy silnika 2.0.

          Wyniki nie są jeszcze publikowane jako ostateczne.

          ## Zasady

          - jawna metodologia,
          - pełny rozkład punktów,
          - rozróżnienie zera i braku danych,
          - oddzielenie wartości odżywczej od ceny,
          - źródło każdej wartości,
          - automatyczne testy przed publikacją,
          - brak publikowania niepełnych danych
            jako pełnych wyników.

          ## Źródła

          Podstawowym źródłem danych odżywczych jest
          USDA FoodData Central.

          ## Odpowiedzialność

          Indeks ma charakter edukacyjny i analityczny.
          Nie stanowi diagnozy ani indywidualnego
          zalecenia medycznego.
          EOF

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kontrola konfiguracji
        run: |
          python -m src.validate_config

      - name: Testy automatyczne
        run: |
          python -m pytest -q

      - name: Kontrola bezpieczeństwa
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          key = os.environ.get(
              "USDA_API_KEY",
              ""
          ).strip()

          if not key:
              raise SystemExit(
                  "BŁĄD: Brak klucza podczas "
                  "kontroli bezpieczeństwa."
              )

          forbidden = []

          allowed_suffixes = {
              ".py",
              ".yaml",
              ".yml",
              ".md",
              ".txt",
              ".csv",
              ".html",
              ".ini",
              ".gitignore",
          }

          ignored_parts = {
              ".git",
              ".pytest_cache",
              "__pycache__",
          }

          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue

              if any(
                  part in ignored_parts
                  for part in path.parts
              ):
                  continue

              if (
                  path.suffix
                  and path.suffix not in allowed_suffixes
              ):
                  continue

              try:
                  content = path.read_text(
                      encoding="utf-8"
                  )
              except UnicodeDecodeError:
                  continue

              if key in content:
                  forbidden.append(str(path))

          if forbidden:
              raise SystemExit(
                  "BŁĄD: Klucz USDA wykryto w plikach: "
                  + ", ".join(forbidden)
              )

          print("KONTROLA BEZPIECZEŃSTWA: OK")
          print("Klucz USDA nie występuje w plikach.")
          PY

      - name: Zapisanie fundamentu w repozytorium
        run: |
          git config user.name "Indeks Żywności Bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            README.md \
            requirements.txt \
            pytest.ini \
            config \
            data \
            artifacts \
            src \
            tests \
            public

          if git diff --cached --quiet; then
            echo "Struktura projektu jest już aktualna."
          else
            git commit \
              -m "Utworzenie fundamentu silnika 2.0"

            git push origin HEAD:main
          fi

      - name: Podsumowanie
        run: |
          echo "=========================================="
          echo "INSTALACJA ZAKOŃCZONA"
          echo "USDA API: OK"
          echo "KONFIGURACJA: OK"
          echo "TESTY: OK"
          echo "BEZPIECZEŃSTWO: OK"
          echo "FUNDAMENT SILNIKA 2.0: UTWORZONY"
          echo "=========================================="
